name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Azure application (client) id, stored as an Actions *secret* so it never appears in the repo or logs.
  FROST_MS_CLIENT_ID: ${{ secrets.FROST_MS_CLIENT_ID }}

jobs:
  agent-fabric:
    name: Fabric mods 1.21.10 / 1.21.11
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - run: bash ci/run.sh gradle -p agent build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-121
          path: |
            agent/mc-*/build/libs/frost-fabric-*.jar
            !agent/mc-*/build/libs/*-sources.jar
          if-no-files-found: error

  agent-26:
    name: Fabric mods 26.1.2 / 26.2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - run: bash ci/run.sh gradle -p agent-26 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-26
          path: |
            agent-26/mc-*/build/libs/frost-fabric-*.jar
            !agent-26/mc-*/build/libs/*-sources.jar
          if-no-files-found: error

  agent-189:
    name: Forge mod 1.8.9
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "7.6.4" }
      - run: bash ci/run.sh gradle -p agent-1.8.9 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mod-forge-189
          path: |
            agent-1.8.9/build/libs/frost-forge-*.jar
            !agent-1.8.9/build/libs/*-sources.jar
            !agent-1.8.9/build/libs/*-dev.jar
          if-no-files-found: error

  linux:
    name: Linux (tests + AppImage)
    runs-on: ubuntu-22.04
    needs: [agent-fabric, agent-26, agent-189]
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf file
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: src-tauri/agent
          merge-multiple: true
      - name: Flatten mod jars
        run: |
          find src-tauri/agent -mindepth 2 -name '*.jar' -exec mv {} src-tauri/agent/ \;
          find src-tauri/agent -mindepth 1 -type d -empty -delete
          ls -la src-tauri/agent
          test "$(ls src-tauri/agent/*.jar | wc -l)" -ge 5
      - name: Unit tests
        run: bash ci/run.sh cargo test --release -p frost-client
      - name: Build AppImage
        run: bash ci/run.sh npx --yes @tauri-apps/cli@2 build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: FrostClient-linux
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    needs: [agent-fabric, agent-26, agent-189]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: src-tauri/agent
          merge-multiple: true
      - name: Flatten mod jars
        shell: bash
        run: |
          find src-tauri/agent -mindepth 2 -name '*.jar' -exec mv {} src-tauri/agent/ \;
          find src-tauri/agent -mindepth 1 -type d -empty -delete
          ls -la src-tauri/agent
          test "$(ls src-tauri/agent/*.jar | wc -l)" -ge 5
      - name: Build installer
        shell: bash
        run: bash ci/run.sh npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: FrostClient-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FrostClient-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
