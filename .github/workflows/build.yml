name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Public Azure application (client) id, set once under Settings > Variables > Actions.
  FROST_MS_CLIENT_ID: ${{ vars.FROST_MS_CLIENT_ID }}

jobs:
  linux:
    name: Linux (test + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Unit tests
        run: bash ci/run.sh cargo test --release
      - name: Build
        run: bash ci/run.sh cargo build --release
      - name: Package AppImage
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          bash packaging/linux/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: FrostClient-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  agent:
    name: Fabric agent (test + mods)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build + test
        run: bash ci/run.sh gradle -p agent build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FrostClient-fabric-mods
          path: |
            agent/mc-*/build/libs/frost-fabric-*.jar
            !agent/mc-*/build/libs/*-sources.jar
          if-no-files-found: error

  windows:
    name: Windows (build + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: bash ci/run.sh cargo build --release
      - name: Installer (NSIS)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue)
          if ($nsis) { $makensis = $nsis.Source } else { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis "/DVERSION=$version" packaging\windows\frost.nsi
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item packaging\windows\FrostClient-Setup-*.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: FrostClient-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
