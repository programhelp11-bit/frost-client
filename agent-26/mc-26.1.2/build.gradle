plugins {
    id 'net.fabricmc.fabric-loom'
}

base { archivesName = 'frost-fabric-26.1.2' }
version = '1.0.0'

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.18.4"
    implementation "net.fabricmc.fabric-api:fabric-api:0.151.0+26.1.2"
}

sourceSets {
    main {
        java {
            srcDir '../../agent/core/src/main/java'
            srcDir '../mc-common/src/main/java'
        }
        resources {
            srcDir '../../agent/mc-common/src/main/resources'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
