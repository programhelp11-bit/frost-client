# Render blueprint for the Frost cosmetics backend (community capes, presence).
# Add a persistent disk so capes survive restarts (paid plan), or accept that the free tier forgets them.
services:
  - type: web
    name: frost-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /data
    disk:
      name: frost-data
      mountPath: /data
      sizeGB: 1
